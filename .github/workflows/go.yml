# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
    paths:
      - 'l2c-cli/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'l2c-cli/**'

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'l2c-cli/go.mod'
        cache-dependency-path: l2c-cli/go.sum

    - name: Build
      run: make build-all

    - name: Test
      working-directory: l2c-cli
      run: go test -v ./...

    - name: Upload Binaries
      uses: actions/upload-artifact@v6
      with:
        name: l2c-binaries
        path: bin/

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Latest Build"
        files: |
          bin/l2c-linux-amd64
          bin/l2c-darwin-amd64
          bin/l2c-darwin-arm64
          bin/l2c-windows-amd64.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
